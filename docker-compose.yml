services:
  reviewboxd:
    build: .
    image: reviewboxd
    container_name: reviewboxd
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000 # the port inside the container; change HOST_PORT to move it on the host
    ports:
      # Only reachable from the server itself; a reverse proxy or tunnel sits in front.
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    volumes:
      - cards:/app/data
      # Editable without rebuilding the image (the server re-reads them on every request).
      - ./sponsors.json:/app/sponsors.json:ro
      - ./taglines.json:/app/taglines.json:ro
      - ./public/sponsors:/app/public/sponsors:ro

  # Optional HTTPS via Cloudflare Tunnel: start with `docker compose --profile tunnel up -d`.
  # Needs CLOUDFLARE_TUNNEL_TOKEN in .env. In Cloudflare, point the hostname to http://reviewboxd:3000
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: reviewboxd-tunnel
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - reviewboxd

volumes:
  cards:
